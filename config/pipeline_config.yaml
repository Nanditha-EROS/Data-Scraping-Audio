# =========================================================================
# pipeline_config.yaml -- all tunable thresholds, worker caps, storage.
# CPU-ONLY build: device is forced to "cpu" everywhere; GPU-heavy models run
# behind a single inference worker to avoid CPU thread contention.
# NO SQLite: resume is by output-file existence + a JSONL audit run-log.
# =========================================================================

state_name: "tamil-nadu"

# Force CPU everywhere (Intel iGPU, no CUDA). Set to "auto" to allow cuda if present.
device: "cpu"

# ---------------------------------------------------------------------------
# Storage / upload (Design: GCS destination; local backend for testing).
# Final layout:  <root>/<state_name>/<audio_category>/<recording_id>.wav|.txt
# Only ACCEPT (Gold) and REVIEW are stored. REJECT is never stored.
# ---------------------------------------------------------------------------
storage:
  backend: "gcs"                  # "local" | "gcs"  -- gcs: upload only, no local data
  root: "kl-workspace/Data_scraping_version1/Song"   # for gcs: first segment = bucket
  review_subdir: "review"         # REVIEW -> <root>/<state>/review/<category>/...
  save_lyrics_txt: true
  staging_dir: null               # null = system temp dir (e.g. %TEMP%/tnfolk-staging)
  gcloud_path: "C:/Users/Lenovo/AppData/Local/Google/Cloud SDK/google-cloud-sdk/bin/gcloud.cmd"

# ---------------------------------------------------------------------------
# Resume / audit. No database.
# ---------------------------------------------------------------------------
run_log:
  path: "state/run_log.jsonl"
fingerprint_store:
  path: "state/fingerprints.jsonl"

# ---------------------------------------------------------------------------
# Per-stage concurrency caps. inference/transcription = 1 (CPU-only, no GPU).
# ---------------------------------------------------------------------------
workers:
  search: 2
  download: 2
  quality: 2
  inference: 1
  transcription: 1

# ---------------------------------------------------------------------------
# Network reliability (tenacity).
# ---------------------------------------------------------------------------
retry:
  max_attempts: 2  # Fail-fast: prevents waiting on dead external endpoints
  initial_backoff_sec: 2.0
  max_backoff_sec: 60.0
  backoff_multiplier: 2.0
  jitter_sec: 1.0

search_page_retry:
  max_attempts: 3
  initial_backoff_sec: 5.0
  max_backoff_sec: 30.0
  backoff_multiplier: 2.0
  jitter_sec: 2.0
  retry_on_status: [403, 429]

# ---------------------------------------------------------------------------
# Search / discovery -- EXHAUST MODE
# ---------------------------------------------------------------------------
search:
  exhaust_max_rounds: 3
  exhaust_confirm_empty: 2
  max_videos: 0
  max_pages_per_query: 6
  max_per_query: 100

  cookies_from_browser: "firefox"

  exhaust_channel_expand: 5
  max_channel_videos: 300

  sleep_between_searches_sec: 5
  sleep_between_rounds_sec: 10
  sleep_between_requests_sec: 2.5

  extractor_retries: 3
  extractor_retry_sleep: "exp=3:30"
  ytsearch_batch_size: 100

# ---------------------------------------------------------------------------
# Download (yt-dlp + ffmpeg).
# ---------------------------------------------------------------------------
download:
  format: "bestaudio/best"
  target_sample_rate: 16000
  target_channels: 1
  cookies_from_browser: null      # null avoids SABR PO-token requirements on audio download
  ffmpeg_path: null
  ffprobe_path: null

# ---------------------------------------------------------------------------
# Audio duration bounds & Chunking for long videos
# ---------------------------------------------------------------------------
audio:
  minimum_duration_sec: 10
  maximum_duration_sec: 300

chunking:
  enabled: false
  chunk_threshold_sec: 300
  target_chunk_duration_sec: 120
  min_chunk_duration_sec: 30
  max_chunk_duration_sec: 180
  max_chunks_per_video: 5
  silence_thresh_db: -35
  min_silence_len_sec: 0.8

# ---------------------------------------------------------------------------
# Metadata relevance gate
# ---------------------------------------------------------------------------
metadata_gate:
  fuzzy_match_threshold: 70
  min_keyword_hits: 1
  review_margin: 8
  exclude_terms:
    INTERVIEW: ["interview", "பேட்டி", "petti"]
    SPEECH: ["speech", "பேச்சு", "pechu", "address", "உரை"]
    PODCAST: ["podcast"]
    NEWS: ["news", "செய்திகள்"]
    LECTURE: ["lecture", "சொற்பொழிவு", "sorpozhivu"]

# ---------------------------------------------------------------------------
# Audio quality gate
# ---------------------------------------------------------------------------
quality_gate:
  minimum_quality_score: 0.55
  maximum_silence_ratio: 0.45
  near_silence_dbfs: -55.0
  maximum_clipping_ratio: 0.05
  clipping_sample_threshold: 0.99
  minimum_snr_db: 5.0
  maximum_noise_floor_dbfs: -25.0
  minimum_dynamic_range_db: 4.0
  loudness:
    min_lufs: -45.0
    max_lufs: -4.0
  dropout:
    max_dropout_ratio: 0.10
    gap_min_ms: 50
  bandwidth:
    min_rolloff_hz: 3000.0
  min_sample_rate: 16000

# ---------------------------------------------------------------------------
# Music / Speech / Mixed classifier (PANNs Cnn14, CPU).
# ---------------------------------------------------------------------------
classifier:
  music_min_prob: 0.25
  speech_reject_prob: 0.85
  mixed_low: 0.25
  default_max_speech_ratio: 0.55

# ---------------------------------------------------------------------------
# VAD (Silero)
# ---------------------------------------------------------------------------
vad:
  threshold: 0.5
  sampling_rate: 16000

# ---------------------------------------------------------------------------
# Folk-relevance gate.
# ---------------------------------------------------------------------------
folk_relevance:
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  accept_similarity: 0.35
  review_similarity: 0.25
  uncertain_band: 0.06
  clap:
    enabled: true
    model_name: null
    blend_weight: 0.5

# ---------------------------------------------------------------------------
# Duplicate detection
# ---------------------------------------------------------------------------
duplicate:
  fingerprint_similarity: 0.90
  fpcalc_length_sec: 120
  fpcalc_path: null

# ---------------------------------------------------------------------------
# Weighted final scoring + decision buckets.
# ---------------------------------------------------------------------------
scoring:
  weights:
    quality: 0.40
    folk_relevance: 0.30
    music_speech: 0.20
    vad: 0.10
  accept_threshold: 0.50
  review_threshold: 0.40

# ---------------------------------------------------------------------------
# Post-accept transcription -- remote GPU API.
# ---------------------------------------------------------------------------
transcription:
  backend: "api"
  language: "ta"

  # Primary remote GPU API endpoint
  api_url: "http://34.180.59.63:5001/api/transcribe"
  # Fallback remote GPU API endpoint if primary fails
  fallback_api_url: "http://34.180.25.118:3005/api/transcribe"
  api_timeout_sec: 180
  api_task: "transcribe"

  # -- Local faster-whisper settings (backend: "local") -- uncomment to use --
  # DO NOT uncomment for normal runs: this checkpoint has no model card, no
  # eval data, and effectively no community usage.
  # hf_model_id: "inspiredclone101/whisper-tamil-ft-v1"
  # ct2_model_dir: "models/whisper-tamil-ft-v1-ct2"
  # compute_type: "int8"
  # beam_size: 5
  # vad_filter: true

  max_retries: 1  # NOTE: actual retries controlled by retry.max_attempts below

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  dir: "logs"
  file: "pipeline.log"
